name: Generate and publish

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      count:
        description: How many new booklets to generate
        required: true
        default: '3'
        type: choice
        options: ['1', '3', '6']

      force_generate:
        description: Generate more even if today's booklets already exist
        required: true
        default: true
        type: boolean

      use_ai:
        description: Use external AI providers
        required: true
        default: true
        type: boolean

      ai_provider:
        description: AI provider and fallback order
        required: true
        default: auto
        type: choice
        options:
          - auto
          - openai-first
          - gemini-first
          - openai-only
          - gemini-only
          - local

      chaos_level:
        description: Design chaos (-1 auto, 0 safe, 5 wild)
        required: true
        default: '-1'
        type: choice
        options: ['-1', '0', '1', '2', '3', '4', '5']



      max_fonts:
        description: Maximum Google Fonts per booklet
        required: true
        default: '20'
        type: choice
        options: ['2', '4', '8', '12', '20']

      image_provider:
        description: Photo source
        required: true
        default: mixed
        type: choice
        options: [mixed, unsplash, openverse]

      style:
        description: Editorial profile ID
        required: false
        default: auto
        type: string

      visual_mode:
        description: Visual language
        required: true
        default: auto
        type: choice
        options: [auto, minimal, abstract, mixed]

      layout_complexity:
        description: Page complexity (1 spacious, 5 dense)
        required: true
        default: '2'
        type: choice
        options: ['1', '2', '3', '4', '5']

      effect_level:
        description: Effects intensity
        required: true
        default: '2'
        type: choice
        options: ['0', '1', '2', '3', '4', '5']

      effects:
        description: Optional comma-separated effect preferences
        required: false
        default: ''
        type: string

      fonts:
        description: Optional comma-separated Google Font families
        required: false
        default: ''
        type: string

      topic:
        description: Booklet topic (leave empty for automatic selection)
        required: false
        default: ''
        type: string

      topic_path:
        description: Optional slash-separated topic catalog path
        required: false
        default: ''
        type: string

      description:
        description: Approximate description or creative brief (leave empty for automatic generation)
        required: false
        default: ''
        type: string

      request_issue:
        description: Public request issue number for status updates
        required: false
        default: ''
        type: string

  schedule:
    - cron: '15 07 * * *'
      timezone: 'Europe/Riga'

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate booklet concepts
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL }}
          GEMINI_SECOND_FALLBACK_MODEL: ${{ vars.GEMINI_SECOND_FALLBACK_MODEL }}
          GEMINI_MAX_ATTEMPTS: '4'
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          IMAGE_PROVIDER: ${{ github.event_name == 'workflow_dispatch' && inputs.image_provider || 'mixed' }}
          BOOKLET_COUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.count || '3' }}
          FORCE_GENERATE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_generate && 'true' || 'false' }}
          USE_AI: ${{ github.event_name == 'schedule' && 'true' || (inputs.use_ai && 'true' || 'false') }}
          AI_PROVIDER: ${{ github.event_name == 'schedule' && 'auto' || (!inputs.use_ai && 'local' || inputs.ai_provider) }}
          CHAOS_LEVEL: ${{ github.event_name == 'workflow_dispatch' && inputs.chaos_level || '-1' }}
          MAX_FONTS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_fonts || '20' }}
          BOOKLET_STYLE: ${{ github.event_name == 'workflow_dispatch' && inputs.style != 'auto' && inputs.style || '' }}
          VISUAL_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.visual_mode || 'auto' }}
          LAYOUT_COMPLEXITY: ${{ github.event_name == 'workflow_dispatch' && inputs.layout_complexity || '2' }}
          EFFECT_LEVEL: ${{ github.event_name == 'workflow_dispatch' && inputs.effect_level || '2' }}
          BOOKLET_EFFECTS: ${{ github.event_name == 'workflow_dispatch' && inputs.effects || '' }}
          BOOKLET_FONTS: ${{ github.event_name == 'workflow_dispatch' && inputs.fonts || '' }}
          BOOKLET_TOPIC: ${{ github.event_name == 'workflow_dispatch' && inputs.topic || '' }}
          BOOKLET_TOPIC_PATH: ${{ github.event_name == 'workflow_dispatch' && inputs.topic_path || '' }}
          BOOKLET_DESCRIPTION: ${{ github.event_name == 'workflow_dispatch' && inputs.description || '' }}
          BOOKLET_RUN_ID: ${{ github.run_id }}
        run: npm run generate

      - name: Commit generated concepts
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if git diff --quiet; then
            echo "No new concepts to commit."
            exit 0
          fi

          git config user.name "ai-booklet-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/booklets.json
          git commit -m "Add generated booklet concepts"
          git push

      - name: Build Astro static site
        run: |
          npx astro build || true

      - name: Prepare static site
        run: |
          mkdir -p _site
          if [ -d "dist" ]; then
            cp -R dist/* _site/
          fi
          touch _site/.nojekyll
          cp index.html styles.css app.js privacy.html _site/ 2>/dev/null || true
          cp wedding.html menu.html gifts.html events.html _site/ 2>/dev/null || true
          cp robots.txt sitemap.xml _site/ 2>/dev/null || true
          cp -R data _site/data
          cp -R vendor _site/vendor
          cp -R src _site/src
          cp -R styles _site/styles

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Mark public request as finished
        if: github.event_name == 'workflow_dispatch' && inputs.request_issue != ''
        uses: actions/github-script@v7
        env:
          REQUEST_ISSUE: ${{ inputs.request_issue }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const issueNumber = Number(process.env.REQUEST_ISSUE);
            const dataPath = path.join(process.env.GITHUB_WORKSPACE, 'data', 'booklets.json');
            const booklets = JSON.parse(fs.readFileSync(dataPath, 'utf8'));
            const newestBookletId = booklets[0]?.id || '';
            const resultUrl = newestBookletId
              ? `${process.env.PAGE_URL}?booklet=${encodeURIComponent(newestBookletId)}`
              : process.env.PAGE_URL;

            for (const label of ['pending', 'processing']) {
              try {
                await github.rest.issues.removeLabel({
                  ...context.repo,
                  issue_number: issueNumber,
                  name: label
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: issueNumber,
              labels: ['finished']
            });
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issueNumber,
              body: `Generation finished and published: ${resultUrl}`
            });
            const currentIssue = await github.rest.issues.get({
              ...context.repo,
              issue_number: issueNumber
            });
            const currentBody = String(currentIssue.data.body || '').replace(/^result_url:\s*\S+\s*$/mi, '').trim();
            await github.rest.issues.update({
              ...context.repo,
              issue_number: issueNumber,
              body: `${currentBody}\n\nresult_url: ${resultUrl}`
            });
            await github.rest.issues.update({
              ...context.repo,
              issue_number: issueNumber,
              state: 'closed',
              state_reason: 'completed'
            });
