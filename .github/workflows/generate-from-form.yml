name: Generate from website form

on:
  issues:
    types: [opened]

permissions:
  actions: write
  issues: write

jobs:
  dispatch-generation:
    if: startsWith(github.event.issue.title, '[BOOKLET REQUEST]')
    runs-on: ubuntu-latest

    steps:
      - name: Validate brief and start generator
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const issueNumber = context.payload.issue.number;
            const oneHourAgo = Date.now() - 60 * 60 * 1000;

            const statusLabels = [
              { name: 'booklet-request', color: '7057ff', description: 'Public booklet generation request' },
              { name: 'pending', color: 'd4c5f9', description: 'Waiting for processing' },
              { name: 'processing', color: 'fbca04', description: 'Generation is running' },
              { name: 'finished', color: '0e8a16', description: 'Generation finished' }
            ];

            for (const label of statusLabels) {
              try {
                await github.rest.issues.createLabel({ ...context.repo, ...label });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
            }

            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: issueNumber,
              labels: ['booklet-request', 'pending']
            });

            const recentIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });

            const recentRequests = recentIssues.filter(issue =>
              issue.title.startsWith('[BOOKLET REQUEST]') &&
              new Date(issue.created_at).getTime() >= oneHourAgo
            );

            if (recentRequests.length > 3) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issueNumber,
                body: 'Automatic generation is temporarily rate-limited. Please try again in one hour.'
              });
              core.setFailed('Public generation rate limit reached.');
              return;
            }

            const escapeRegex = value => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const clean = (value, maxLength) => String(value || '')
              .replace(/<br\s*\/?>/gi, ' ')
              .replace(/[*`]/g, '')
              .replace(/\s+/g, ' ')
              .trim()
              .slice(0, maxLength);

            function field(name, maxLength = 800) {
              const key = escapeRegex(name);
              const patterns = [
                new RegExp(`(?:^|\\n)\\s*(?:[-+]\\s*)?(?:\\*\\*|__)?${key}(?:\\*\\*|__)?\\s*[:=]\\s*([^\\n]+)`, 'i'),
                new RegExp(`(?:^|\\n)\\s*\\|\\s*${key}\\s*\\|\\s*([^|\\n]+)`, 'i'),
                new RegExp(`(?:^|\\n)\\s*#{1,6}\\s*${key}\\s*\\n\\s*([^\\n]+)`, 'i')
              ];
              for (const pattern of patterns) {
                const match = body.match(pattern);
                if (match) return clean(match[1], maxLength);
              }
              return '';
            }

            const requestType = field('request_type', 40);
            if (requestType !== 'booklet_generation') {
              core.setFailed('Issue is not a booklet generation request.');
              return;
            }

            const allowedCounts = new Set(['1', '3', '6']);
            const allowedChaos = new Set(['-1', '0', '1', '2', '3', '4', '5']);
            const allowedFonts = new Set(['2', '4', '8', '12', '20']);
            const allowedProviders = new Set(['auto', 'openai-first', 'gemini-first', 'local']);
            const allowedStyles = new Set([
              'auto',
              'civic-nonprofit',
              'eu-institutional',
              'public-department',
              'pan-european-newsroom'
            ]);

            const selectedStyle = field('style', 80) || 'auto';
            const customStyle = field('custom_style', 180);
            const topic = field('topic', 140);
            const rawDescription = field('description', 700);
            const styleNote = customStyle ? `Custom visual direction: ${customStyle}.` : '';
            const description = clean([styleNote, rawDescription].filter(Boolean).join(' '), 800);

            if (!topic) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issueNumber,
                body: 'The request could not be generated because the topic field was empty.'
              });
              core.setFailed('Missing topic.');
              return;
            }

            const inputs = {
              count: allowedCounts.has(field('count', 2)) ? field('count', 2) : '1',
              force_generate: 'true',
              use_ai: field('ai_provider', 30) === 'local' ? 'false' : 'true',
              ai_provider: allowedProviders.has(field('ai_provider', 30)) ? field('ai_provider', 30) : 'auto',
              chaos_level: allowedChaos.has(field('chaos_level', 2)) ? field('chaos_level', 2) : '-1',
              max_fonts: allowedFonts.has(field('max_fonts', 2)) ? field('max_fonts', 2) : '20',
              image_provider: 'mixed',
              style: allowedStyles.has(selectedStyle) ? selectedStyle : 'auto',
              fonts: field('custom_fonts', 240),
              topic,
              description
            };

            inputs.request_issue = String(issueNumber);

            await github.rest.issues.removeLabel({
              ...context.repo,
              issue_number: issueNumber,
              name: 'pending'
            });
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: issueNumber,
              labels: ['processing']
            });

            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'publish.yml',
              ref: 'main',
              inputs
            });

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issueNumber,
              body: `Generation accepted: ${inputs.count} booklet(s) about **${topic}**. The collection will update after the workflow finishes.`
            });
